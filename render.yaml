services:
  # ── CycloNet Backend (FastAPI + PyTorch + Gemini AI) ────────────────────────
  - type: web
    name: cyclonet-backend
    branch: main
    autoDeployTrigger: "off"
    runtime: python
    rootDir: backend
    plan: standard
    region: oregon
    buildCommand: "pip install --require-hashes --extra-index-url https://download.pytorch.org/whl/cpu -r requirements-linux.lock"
    preDeployCommand: "alembic upgrade head"
    healthCheckPath: /health/ready
    maxShutdownDelaySeconds: 90
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT --timeout-graceful-shutdown 60 --timeout-keep-alive 5 --ws-max-size 4096 --no-access-log"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.15
      - key: ENVIRONMENT
        value: production
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "5"
      - key: DB_POOL_TIMEOUT
        value: "5"
      - key: DATABASE_URL
        fromDatabase:
          name: cyclonet-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: cyclonet-redis
          property: connectionString
      - key: REDIS_FAIL_CLOSED
        value: "true"
      - key: CLERK_ISSUER
        sync: false
      - key: CLERK_JWKS_URL
        sync: false
      - key: CLERK_AUTHORIZED_PARTIES
        value: "https://cyclonet-frontend.onrender.com"
      - key: REQUIRE_VALIDATED_ML
        value: "false" # Experimental API only; no validated model is bundled.
      - key: GEMINI_API_KEY
        sync: false # Set securely in Render dashboard
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: CORS_ORIGINS
        value: "https://cyclonet-frontend.onrender.com"

  # ── CycloNet Frontend (Next.js 16 + Tailwind CSS) ───────────────────────────
  - type: web
    name: cyclonet-frontend
    branch: main
    autoDeployTrigger: "off"
    runtime: node
    rootDir: frontend
    plan: starter
    region: oregon
    buildCommand: "npm ci && npm run build"
    startCommand: "npm run start"
    healthCheckPath: /login
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: NEXT_PUBLIC_API_URL
        value: "https://cyclonet-backend.onrender.com"
      - key: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
        sync: false # Set securely in Render dashboard
      - key: CLERK_SECRET_KEY
        sync: false # Set securely in Render dashboard
      - key: NEXT_PUBLIC_CLERK_SIGN_IN_URL
        value: /login
      - key: NEXT_PUBLIC_CLERK_SIGN_UP_URL
        value: /login?mode=signup
      - key: NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL
        value: /
      - key: NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL
        value: /

  # ── CycloNet Redis Cache & Distributed Lock Store ───────────────────────────
  - type: keyvalue
    name: cyclonet-redis
    plan: starter
    region: oregon
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  # ── CycloNet PostgreSQL Production Database ─────────────────────────────────
  - name: cyclonet-db
    databaseName: cyclonet
    user: cyclonet
    plan: basic-256mb
    region: oregon
