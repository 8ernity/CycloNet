services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: cyclonet_test
      POSTGRES_USER: cyclonet_test
      POSTGRES_PASSWORD: local-test-only
    ports: ["127.0.0.1:55432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyclonet_test"]
      interval: 2s
      retries: 30
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:56379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30
