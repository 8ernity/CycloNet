name: CycloNet verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: cyclonet_test
          POSTGRES_USER: cyclonet_test
          POSTGRES_PASSWORD: ci-test-only
        ports: [55432:5432]
        options: >-
          --health-cmd "pg_isready -U cyclonet_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql://cyclonet_test:ci-test-only@localhost:55432/cyclonet_test
      TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-linux.lock
      - run: pip install --require-hashes --extra-index-url https://download.pytorch.org/whl/cpu -r backend/requirements-linux.lock
      - run: python -m pytest tests/ -q --junitxml=results.xml
        working-directory: backend
      - run: |
          pip install pip-audit
          pip-audit --no-deps --disable-pip -r backend/requirements-linux.lock
          pip-audit --no-deps --disable-pip -r backend/requirements.lock
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: backend/results.xml
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run lint && npm run typecheck && npm test
      - name: Check Clerk test configuration
        env:
          CLERK_PUBLIC: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET: ${{ secrets.CLERK_SECRET_KEY }}
        run: |
          if [ -z "$CLERK_PUBLIC" ] || [ -z "$CLERK_SECRET" ]; then
            echo "::error::Configure the repository's Clerk test-instance secrets before running authenticated frontend checks."
            exit 1
          fi
      - run: npm run build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: frontend/test-results
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
