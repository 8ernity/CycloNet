# Readiness monitoring, not synthetic warming or a high-availability guarantee.
name: CycloNet readiness monitoring
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: readiness-monitor
  cancel-in-progress: false
jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify frontend and backend readiness
        run: python scripts/check_readiness.py > readiness.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: readiness-result
          path: readiness.json
      - name: Mark unhealthy deployment
        if: failure()
        run: echo "::error::Readiness failed. Inspect the artifact and Render logs. Maintainers must enable workflow failure notifications."
