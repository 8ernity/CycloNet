name: Keep Render Services Alive

on:
  schedule:
    # Runs every 5 minutes to beat Render's 15-minute inactivity idle timer
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping-services:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Frontend and Backend
        run: |
          echo "Pinging CycloNet Frontend..."
          curl -s -f -m 60 --retry 3 --retry-delay 5 "https://cyclonet-frontend.onrender.com" || echo "Frontend ping failed or waking up"
          
          echo "Pinging CycloNet Backend..."
          curl -s -f -m 60 --retry 3 --retry-delay 5 "https://cyclonet-backend.onrender.com/health" || curl -s -f -m 60 "https://cyclonet-backend.onrender.com/" || echo "Backend ping failed or waking up"
