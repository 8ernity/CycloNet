name: Keep Render Backend Alive

on:
  schedule:
    # Runs every 14 minutes (Render sleeps after 15 min of inactivity)
    - cron: '*/14 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Ping CycloNet Backend
        run: |
          echo "Pinging CycloNet Backend to prevent Render cold start..."
          curl -s -f -m 30 "https://cyclonet-backend.onrender.com/health" || curl -s -f -m 60 "https://cyclonet-backend.onrender.com/" || echo "Ping failed or server waking up"
